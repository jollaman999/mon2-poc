# PoC: 알림을 한 곳(webhook)으로만 보낸다. 두 Alertmanager 가 클러스터로 중복을 줄인다.
route:
  receiver: poc-webhook
  group_by: [alertname]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
receivers:
  - name: poc-webhook
    webhook_configs:
      - url: http://@WEBHOOK@/alerts
        send_resolved: true
