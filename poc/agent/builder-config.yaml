# OCB(OpenTelemetry Collector Builder) 부품 목록. poc/Makefile 의 make agent 가 쓴다.
dist:
  name: cmp-otelcol
  description: cmp-mon 에이전트 (PoC)
  version: 0.1.0-poc
  output_path: ./_build

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.164.0
  - gomod: github.com/jollaman999/mon2-poc/agent/accelerator v0.0.0
  - gomod: github.com/jollaman999/mon2-poc/agent/unifiedlog v0.0.0
  - gomod: github.com/jollaman999/mon2-poc/agent/exec v0.0.0
  - gomod: github.com/jollaman999/mon2-poc/agent/winpackettrace v0.0.0
  - gomod: github.com/jollaman999/mon2-poc/agent/vsphere v0.0.0
  - gomod: github.com/jollaman999/mon2-poc/agent/hypervisor v0.0.0
processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.164.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.164.0
  - gomod: github.com/jollaman999/mon2-poc/agent/top10process v0.0.0
exporters:
  - gomod: github.com/jollaman999/mon2-poc/agent/cmpotlp v0.0.0
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.164.0
connectors:
  - gomod: github.com/jollaman999/mon2-poc/agent/gpujoin v0.0.0
extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.164.0

# 자체 부품은 이 저장소의 폴더를 그대로 쓴다. accelerator 가 go 1.27.2 를 요구해서 빌드에 Go 1.27.2 이상이 필요하다 (Makefile 참고)
replaces:
  - github.com/jollaman999/mon2-poc/agent/accelerator => ../accelerator
  - github.com/jollaman999/mon2-poc/agent/unifiedlog => ../unifiedlog
  - github.com/jollaman999/mon2-poc/agent/exec => ../exec
  - github.com/jollaman999/mon2-poc/agent/winpackettrace => ../winpackettrace
  - github.com/jollaman999/mon2-poc/agent/vsphere => ../vsphere
  - github.com/jollaman999/mon2-poc/agent/hypervisor => ../hypervisor
  - github.com/jollaman999/mon2-poc/agent/top10process => ../top10process
  - github.com/jollaman999/mon2-poc/agent/cmpotlp => ../cmpotlp
  - github.com/jollaman999/mon2-poc/agent/gpujoin => ../gpujoin
