unifiedlog:
unifiedlog/full:
  priority: [rsyslog, journald, services]
  storage: file_storage
  rsyslog:
    files: [/var/log/syslog, /var/log/messages, /var/log/secure]
    from_beginning: true
  journald:
    units: [sshd.service]
    priority: info
    cursor_path: /var/lib/agent/journald.cursor
    cursor_flush_interval: 2s
  syslog_server:
    address: udp://0.0.0.0:5514
    read_timeout: 30s
    max_connections: 10
    tags:
      source: esxi
    ip_map_file: /etc/agent/ip-map.json
    ip_map_reload_interval: 10s
  services:
    scan_interval: 30s
    text_probe_bytes: 1024
    skip_paths: [/opt/data/]
    skip_extensions: [.wal]
    multiline_start: '^\d{4}-\d{2}-\d{2}'
  eventlog:
    channels: [Application, System, Security]
    event_tags: [Source, EventID, Level, LevelText, Channel]
    event_fields: [Message]
    timestamp_from_event: true
    gather_interval: 5s
  parser:
    format: regex
    regex: '^(?P<time>(?:[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}|\S+))\s+(?P<host>\S+)\s+(?P<ident>[^:\[\s]+)(?:\[(?P<pid>\d+)\])?:\s*(?P<message>.*)$'
    time_key: time
    time_formats: ["%Y-%m-%dT%H:%M:%S.%f%:z", "%Y-%m-%dT%H:%M:%S%:z", "%b %d %H:%M:%S"]
    name_key: ident
    tag_keys: [host]
    types:
      pid: integer
unifiedlog/bad:
  priority: [rsyslog, nope]
  parser:
    format: regex
