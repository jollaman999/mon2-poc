<rect x="660" y="613" width="420" height="104" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
<text x="680" y="655" font-size="13.5" fill="#475569" font-weight="400" text-anchor="start">furiosa-smi-go (순수 Go, Apache-2.0)</text>
<text x="680" y="683" font-size="13.5" fill="#475569" font-weight="400" text-anchor="start">sysfs 를 직접 읽어 CGO 없이 들어간다</text>
