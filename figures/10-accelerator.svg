<text x="1245.0" y="378.98749999999995" font-size="19" fill="#9a3412" font-weight="700" text-anchor="middle">accelerator 수신기</text>
<text x="1245.0" y="400.56249999999994" font-size="13.5" fill="#9a3412" font-weight="400" text-anchor="middle">(벤더별 백엔드를 가진 자체 부품)</text>
<text x="1245.0" y="420.13749999999993" font-size="13.5" fill="#9a3412" font-weight="400" text-anchor="middle"></text>
