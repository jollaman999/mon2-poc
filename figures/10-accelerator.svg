<text x="170.0" y="804.725" font-size="13" fill="#475569" font-weight="400" text-anchor="middle">GPU Operator · DME · 추론 엔진</text>
<rect x="330" y="735" width="300" height="104" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="480.0" y="792.775" font-size="16.5" fill="#0f172a" font-weight="700" text-anchor="middle">prometheus 수신기 (선택)</text>
<rect x="660" y="735" width="420" height="104" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
<text x="680" y="777" font-size="13.5" fill="#475569" font-weight="400" text-anchor="start">우리가 깔지는 않는다</text>
<text x="680" y="805" font-size="13.5" fill="#475569" font-weight="400" text-anchor="start">vLLM · Furiosa-LLM /metrics 포함</text>
