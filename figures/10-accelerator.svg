<text x="1485.0" y="500.55" font-size="14" fill="#bfdbfe" font-weight="400" text-anchor="middle">OTLP</text>
<path d="M1370,480 L1398,480" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#m-blue)"/>
<rect x="40" y="870" width="1530" height="100" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="60" y="905" font-size="17" fill="#065f46" font-weight="700" text-anchor="start">podman 이 필요 없는 이유</text>
<text x="60" y="940" font-size="14.5" fill="#047857" font-weight="400" text-anchor="start">exporter 를 컨테이너로 돌리지 않는다. 벤더 CLI 는 드라이버와 같이 깔리고, 라이브러리는 dlopen 이나 순수 Go 로 읽는다. 컨테이너가 없으니 SELinux 장치 라벨 문제도 없다</text>
