<rect width="1600" height="1000" fill="#ffffff"/>
<text x="40" y="58" font-size="32" font-weight="700" fill="#0f172a">AI 반도체 수집 - 벤더 도구를 에이전트가 직접 읽는다</text>
<text x="40" y="92" font-size="18" fill="#475569">컨테이너 · podman · nvidia-container-toolkit 없이, 드라이버와 함께 깔리는 도구나 라이브러리만 쓴다</text>
