<text x="1245.0" y="596.3125" font-size="13.5" fill="#9a3412" font-weight="400" text-anchor="middle">벤더 원래 이름도 남김</text>
<rect x="1400" y="425" width="170" height="110" rx="55.0" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="2"/>
