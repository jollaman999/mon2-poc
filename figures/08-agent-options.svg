<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">
<defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="s-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker><marker id="s-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ea580c"/></marker><marker id="s-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ea580c"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#059669"/></marker><marker id="s-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#059669"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c3aed"/></marker><marker id="s-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c3aed"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker><marker id="s-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker></defs>
<rect width="1600" height="960" fill="#ffffff"/>
<text x="40" y="58" font-size="32" font-weight="700" fill="#0f172a">각 서버에 깔 에이전트 - 4가지 후보</text>
<text x="40" y="92" font-size="18" fill="#475569">중계와 저장소는 Victoria 계열로 고정. 서버 쪽은 한 바이너리로 모든 신호를 걷고, OS 를 가리지 않는 것을 기준으로 골랐다</text>
<text x="40" y="261" font-size="15.5" fill="#0f172a" font-weight="700" text-anchor="start">운영 성숙도</text>
<line x1="40" y1="283" x2="1560" y2="283" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="331" font-size="15.5" fill="#0f172a" font-weight="700" text-anchor="start">journald · syslog · 파일</text>
<line x1="40" y1="353" x2="1560" y2="353" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="401" font-size="15.5" fill="#0f172a" font-weight="700" text-anchor="start">Windows 이벤트 로그</text>
<line x1="40" y1="423" x2="1560" y2="423" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="471" font-size="15.5" fill="#0f172a" font-weight="700" text-anchor="start">eBPF 트레이스</text>
<line x1="40" y1="493" x2="1560" y2="493" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="541" font-size="15.5" fill="#0f172a" font-weight="700" text-anchor="start">GPU · NPU (smi · 라이브러리)</text>
<line x1="40" y1="563" x2="1560" y2="563" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="611" font-size="15.5" fill="#0f172a" font-weight="700" text-anchor="start">노드 2개 주소 전환</text>
<line x1="40" y1="633" x2="1560" y2="633" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="681" font-size="15.5" fill="#0f172a" font-weight="700" text-anchor="start">디스크 큐</text>
<line x1="40" y1="703" x2="1560" y2="703" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="751" font-size="15.5" fill="#0f172a" font-weight="700" text-anchor="start">한 바이너리 · 컨테이너 없음</text>
<line x1="40" y1="773" x2="1560" y2="773" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="821" font-size="15.5" fill="#0f172a" font-weight="700" text-anchor="start">새로 만들 코드</text>
<line x1="40" y1="843" x2="1560" y2="843" stroke="#e2e8f0" stroke-width="1"/>
<rect x="300" y="130" width="300" height="790" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
<text x="450" y="168" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle">A. Telegraf + 자체 플러그인</text>
<rect x="400.0" y="182" width="100" height="32" rx="16" fill="#d97706"/>
<text x="450" y="205" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">보류</text>
<text x="450" y="261" font-size="14.5" fill="#047857" font-weight="700" text-anchor="middle">O 오래 쓰임</text>
<text x="450" y="331" font-size="14.5" fill="#b45309" font-weight="700" text-anchor="middle">△ 자체 플러그인</text>
<text x="450" y="401" font-size="14.5" fill="#047857" font-weight="700" text-anchor="middle">O</text>
<text x="450" y="471" font-size="14.5" fill="#b45309" font-weight="700" text-anchor="middle">△ 별도 통합 필요</text>
<text x="450" y="541" font-size="14.5" fill="#b45309" font-weight="700" text-anchor="middle">△ 자체 플러그인</text>
<text x="450" y="611" font-size="14.5" fill="#b45309" font-weight="700" text-anchor="middle">△ influxdb 출력만</text>
<text x="450" y="681" font-size="14.5" fill="#b45309" font-weight="700" text-anchor="middle">△ disk 버퍼 실험적</text>
<text x="450" y="751" font-size="14.5" fill="#047857" font-weight="700" text-anchor="middle">O (CGO 0)</text>
<text x="450" y="821" font-size="14.5" fill="#334155" font-weight="400" text-anchor="middle">플러그인 + 출력 손질</text>
<rect x="618" y="130" width="300" height="790" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
<text x="768" y="168" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle">B. Victoria 에이전트만</text>
<rect x="718.0" y="182" width="100" height="32" rx="16" fill="#dc2626"/>
<text x="768" y="205" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">탈락</text>
<text x="768" y="261" font-size="14.5" fill="#b91c1c" font-weight="700" text-anchor="middle">X</text>
<text x="768" y="331" font-size="14.5" fill="#b45309" font-weight="700" text-anchor="middle">△ 받기만</text>
<text x="768" y="401" font-size="14.5" fill="#b91c1c" font-weight="700" text-anchor="middle">X</text>
<text x="768" y="471" font-size="14.5" fill="#b45309" font-weight="700" text-anchor="middle">△ 받기만 (vtagent)</text>
<text x="768" y="541" font-size="14.5" fill="#b91c1c" font-weight="700" text-anchor="middle">X exporter 필요</text>
<text x="768" y="611" font-size="14.5" fill="#b91c1c" font-weight="700" text-anchor="middle">X 복제만 있음</text>
<text x="768" y="681" font-size="14.5" fill="#047857" font-weight="700" text-anchor="middle">O</text>
<text x="768" y="751" font-size="14.5" fill="#b91c1c" font-weight="700" text-anchor="middle">X 2~3개 + exporter</text>
<text x="768" y="821" font-size="14.5" fill="#334155" font-weight="400" text-anchor="middle">로그 수집기 따로</text>
<rect x="936" y="130" width="300" height="790" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
<text x="1086" y="168" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle">C. 커스텀 OTel Collector</text>
<rect x="1036.0" y="182" width="100" height="32" rx="16" fill="#059669"/>
<text x="1086" y="205" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">선택</text>
<text x="1086" y="261" font-size="14.5" fill="#b45309" font-weight="700" text-anchor="middle">△ 자체 부품은 PoC 로</text>
<text x="1086" y="331" font-size="14.5" fill="#047857" font-weight="700" text-anchor="middle">O 공식 + 자동 선택 부품</text>
<text x="1086" y="401" font-size="14.5" fill="#047857" font-weight="700" text-anchor="middle">O windowseventlog</text>
<text x="1086" y="471" font-size="14.5" fill="#047857" font-weight="700" text-anchor="middle">O OBI (별도 프로세스)</text>
<text x="1086" y="541" font-size="14.5" fill="#047857" font-weight="700" text-anchor="middle">O 자체 수신기</text>
<text x="1086" y="611" font-size="14.5" fill="#047857" font-weight="700" text-anchor="middle">O 자체 exporter</text>
<text x="1086" y="681" font-size="14.5" fill="#047857" font-weight="700" text-anchor="middle">O file_storage</text>
<text x="1086" y="751" font-size="14.5" fill="#047857" font-weight="700" text-anchor="middle">O (OCB 기본 CGO 0)</text>
<text x="1086" y="821" font-size="14.5" fill="#334155" font-weight="400" text-anchor="middle">자체 부품 + 전환 exporter</text>
<rect x="1254" y="130" width="300" height="790" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
<text x="1404" y="168" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle">D. Grafana Alloy</text>
<rect x="1354.0" y="182" width="100" height="32" rx="16" fill="#dc2626"/>
<text x="1404" y="205" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">탈락</text>
<text x="1404" y="261" font-size="14.5" fill="#b91c1c" font-weight="700" text-anchor="middle">X</text>
<text x="1404" y="331" font-size="14.5" fill="#047857" font-weight="700" text-anchor="middle">O</text>
<text x="1404" y="401" font-size="14.5" fill="#047857" font-weight="700" text-anchor="middle">O</text>
<text x="1404" y="471" font-size="14.5" fill="#047857" font-weight="700" text-anchor="middle">O</text>
<text x="1404" y="541" font-size="14.5" fill="#b91c1c" font-weight="700" text-anchor="middle">X 포크해야 넣음</text>
<text x="1404" y="611" font-size="14.5" fill="#b45309" font-weight="700" text-anchor="middle">△</text>
<text x="1404" y="681" font-size="14.5" fill="#047857" font-weight="700" text-anchor="middle">O</text>
<text x="1404" y="751" font-size="14.5" fill="#047857" font-weight="700" text-anchor="middle">O</text>
<text x="1404" y="821" font-size="14.5" fill="#334155" font-weight="400" text-anchor="middle">Alloy 포크</text>
</svg>