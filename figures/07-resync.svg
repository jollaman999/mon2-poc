<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">
<defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="s-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker><marker id="s-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ea580c"/></marker><marker id="s-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ea580c"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#059669"/></marker><marker id="s-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#059669"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c3aed"/></marker><marker id="s-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c3aed"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker><marker id="s-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="40" y="58" font-size="32" font-weight="700" fill="#0f172a">노드 B 가 멈췄다 돌아올 때 - 양쪽이 다시 같아지는 과정</text>
<text x="40" y="92" font-size="18" fill="#475569">중계 에이전트는 목적지마다 따로 디스크 큐를 둔다. 큐 한도 안의 장애는 자동으로 메워진다</text>
<path d="M80,250 L1540,250" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#m-gray)"/>
<circle cx="250" cy="250" r="12" fill="#1e3a8a"/>
<rect x="100" y="140" width="300" height="80" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="250.0" y="176.85" font-size="20" fill="#065f46" font-weight="700" text-anchor="middle">정상</text>
<text x="250.0" y="199.15" font-size="14" fill="#047857" font-weight="400" text-anchor="middle">A·B 둘 다 기록</text>
<circle cx="620" cy="250" r="12" fill="#1e3a8a"/>
<rect x="470" y="140" width="300" height="80" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="620.0" y="176.85" font-size="20" fill="#92400e" font-weight="700" text-anchor="middle">B 멈춤</text>
<text x="620.0" y="199.15" font-size="14" fill="#b45309" font-weight="400" text-anchor="middle">A 기록 · B 몫은 큐로</text>
<circle cx="990" cy="250" r="12" fill="#1e3a8a"/>
<rect x="840" y="140" width="300" height="80" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="990.0" y="176.85" font-size="20" fill="#9a3412" font-weight="700" text-anchor="middle">B 복구</text>
<text x="990.0" y="199.15" font-size="14" fill="#9a3412" font-weight="400" text-anchor="middle">큐를 B 로 다시 보냄</text>
<circle cx="1360" cy="250" r="12" fill="#1e3a8a"/>
<rect x="1210" y="140" width="300" height="80" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1360.0" y="176.85" font-size="20" fill="#065f46" font-weight="700" text-anchor="middle">다시 같음</text>
<text x="1360.0" y="199.15" font-size="14" fill="#047857" font-weight="400" text-anchor="middle">B 를 조회에 다시 넣음</text>
<text x="60" y="345" font-size="18" fill="#065f46" font-weight="700" text-anchor="start">저장소 A</text>
<text x="60" y="445" font-size="18" fill="#065f46" font-weight="700" text-anchor="start">저장소 B</text>
<text x="60" y="545" font-size="18" fill="#9a3412" font-weight="700" text-anchor="start">B 몫 큐</text>
<rect x="170" y="320" width="1370" height="40" rx="8" fill="#10b981"/>
<rect x="170" y="420" width="440" height="40" rx="8" fill="#10b981"/>
<rect x="610" y="420" width="380" height="40" rx="0" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="990" y="420" width="550" height="40" rx="8" fill="#10b981"/>
<rect x="610" y="420" width="380" height="40" fill="#fcd34d" opacity="0.55"/>
<text x="800" y="446" font-size="15" fill="#92400e" font-weight="700" text-anchor="middle">복구 후 큐에서 채워짐</text>
<path d="M610,560 L990,515 L1180,560 Z" fill="#fdba74" opacity="0.8"/>
<text x="800" y="590" font-size="15" fill="#9a3412" font-weight="700" text-anchor="middle">쌓임</text>
<text x="1090" y="590" font-size="15" fill="#9a3412" font-weight="700" text-anchor="middle">비움</text>
<rect x="100" y="640" width="680" height="200" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="124" y="680" font-size="19" fill="#065f46" font-weight="700" text-anchor="start">큐 한도 안의 장애</text>
<text x="124" y="716" font-size="15.5" fill="#047857" font-weight="400" text-anchor="start">자동으로 메워진다. 사람이 할 일 없음.</text>
<text x="124" y="746" font-size="15.5" fill="#047857" font-weight="400" text-anchor="start">한도 = -remoteWrite.maxDiskUsagePerURL (목적지별)</text>
<text x="124" y="776" font-size="15.5" fill="#047857" font-weight="400" text-anchor="start">크기는 PoC 에서 하루 유입량을 재서 정한다 (목표: 최소 하루치)</text>
<rect x="820" y="640" width="720" height="200" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="844" y="680" font-size="19" fill="#991b1b" font-weight="700" text-anchor="start">큐 한도를 넘는 장애</text>
<text x="844" y="716" font-size="15.5" fill="#b91c1c" font-weight="400" text-anchor="start">가장 오래된 것부터 버려져 B 에 빈 구간이 생긴다.</text>
<text x="844" y="746" font-size="15.5" fill="#b91c1c" font-weight="400" text-anchor="start">메트릭: vmctl 로 A 의 해당 구간을 B 로 복사</text>
<text x="844" y="776" font-size="15.5" fill="#b91c1c" font-weight="400" text-anchor="start">로그·트레이스: A 에서 export → B 로 다시 넣기 (절차를 PoC 에서 확정)</text>
</svg>