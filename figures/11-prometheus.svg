<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">
<defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="s-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker><marker id="s-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ea580c"/></marker><marker id="s-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ea580c"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#059669"/></marker><marker id="s-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#059669"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c3aed"/></marker><marker id="s-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c3aed"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker><marker id="s-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="40" y="58" font-size="32" font-weight="700" fill="#0f172a">Prometheus 와 같이 쓰는 구조</text>
<text x="40" y="92" font-size="18" fill="#475569">VictoriaMetrics 는 Prometheus 의 수집 · 전송 · 조회 · 규칙 형식을 그대로 받는다. 이미 있는 Prometheus 를 버리지 않아도 된다</text>
<text x="250" y="150" font-size="18" fill="#334155" font-weight="700" text-anchor="middle">들어오는 쪽</text>
<rect x="60" y="170" width="380" height="110" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="250.0" y="221.5" font-size="19" fill="#92400e" font-weight="700" text-anchor="middle">기존 Prometheus (k8s 등)</text>
<text x="250.0" y="243.8" font-size="14" fill="#b45309" font-weight="400" text-anchor="middle">remote_write → 노드 :18429</text>
<path d="M440,225 C520,225 520,470 598,470" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#m-blue)"/>
<rect x="60" y="320" width="380" height="110" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="250.0" y="371.5" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">prometheus.yml 그대로</text>
<text x="250.0" y="393.8" font-size="14" fill="#475569" font-weight="400" text-anchor="middle">vmagent 가 같은 scrape 설정을 읽음</text>
<path d="M440,375 C520,375 520,470 598,470" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#m-blue)"/>
<rect x="60" y="470" width="380" height="110" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="250.0" y="521.5" font-size="19" fill="#5b21b6" font-weight="700" text-anchor="middle">이미 있는 exporter</text>
<text x="250.0" y="543.8" font-size="14" fill="#6d28d9" font-weight="400" text-anchor="middle">node · dcgm · DME · NPU · vLLM</text>
<path d="M440,525 C520,525 520,470 598,470" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#m-blue)"/>
<rect x="60" y="620" width="380" height="110" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="250.0" y="671.5" font-size="19" fill="#9a3412" font-weight="700" text-anchor="middle">OCB 에이전트</text>
<text x="250.0" y="693.8" font-size="14" fill="#9a3412" font-weight="400" text-anchor="middle">OTLP/HTTP</text>
<path d="M440,675 C520,675 520,470 598,470" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#m-blue)"/>
<rect x="600" y="340" width="400" height="260" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="800.0" y="434.2" font-size="22" fill="#065f46" font-weight="700" text-anchor="middle">VictoriaMetrics ×2</text>
<text x="800.0" y="457.95" font-size="15" fill="#047857" font-weight="400" text-anchor="middle">Prometheus remote_write API</text>
<text x="800.0" y="479.7" font-size="15" fill="#047857" font-weight="400" text-anchor="middle">Prometheus 조회 API (/api/v1/*)</text>
<text x="800.0" y="501.45" font-size="15" fill="#047857" font-weight="400" text-anchor="middle">PromQL + MetricsQL(상위 호환)</text>
<text x="800.0" y="523.2" font-size="15" fill="#047857" font-weight="400" text-anchor="middle">Prometheus 규칙 · 레이블 재작성</text>
<text x="1310" y="150" font-size="18" fill="#334155" font-weight="700" text-anchor="middle">나가는 쪽</text>
<rect x="1140" y="170" width="400" height="110" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="1340.0" y="221.5" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">관리 서버</text>
<text x="1340.0" y="243.8" font-size="14" fill="#475569" font-weight="400" text-anchor="middle">PromQL HTTP API</text>
<path d="M1000,470 C1070,470 1070,225 1138,225" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#m-green)"/>
<rect x="1140" y="320" width="400" height="110" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="1340.0" y="371.5" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">vmalert ×2</text>
<text x="1340.0" y="393.8" font-size="14" fill="#475569" font-weight="400" text-anchor="middle">Prometheus 규칙 파일 그대로</text>
<path d="M1000,470 C1070,470 1070,375 1138,375" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#m-green)"/>
<rect x="1140" y="470" width="400" height="110" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="1340.0" y="521.5" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">Alertmanager ×2 (클러스터)</text>
<text x="1340.0" y="543.8" font-size="14" fill="#475569" font-weight="400" text-anchor="middle">중복 알림을 서로 맞춰 1번만</text>
<path d="M1000,470 C1070,470 1070,525 1138,525" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#m-green)"/>
<rect x="1140" y="620" width="400" height="110" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
<text x="1340.0" y="671.5" font-size="19" fill="#64748b" font-weight="700" text-anchor="middle">다른 팀의 Grafana (있다면)</text>
<text x="1340.0" y="693.8" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="middle">내장 Prometheus 데이터소스로 그대로</text>
<path d="M1000,470 C1070,470 1070,675 1138,675" stroke="#059669" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#m-green)"/>
<path d="M1340,432 L1340,466" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#m-gray)"/>
<rect x="600" y="660" width="400" height="170" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="800" y="696" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">Prometheus 와 다른 점</text>
<text x="800" y="728" font-size="14.5" fill="#475569" font-weight="400" text-anchor="middle">remote_read · remote_write 2.0 · exemplar 없음</text>
<text x="800" y="756" font-size="14.5" fill="#475569" font-weight="400" text-anchor="middle">rate 가 외삽을 안 해 값이 조금 다르다</text>
<text x="800" y="784" font-size="14.5" fill="#475569" font-weight="400" text-anchor="middle">OTLP 이름은 변환 옵션으로 맞춘다</text>
</svg>