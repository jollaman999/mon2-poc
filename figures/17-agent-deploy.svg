<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">
<defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="s-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker><marker id="s-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ea580c"/></marker><marker id="s-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ea580c"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#059669"/></marker><marker id="s-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#059669"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c3aed"/></marker><marker id="s-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c3aed"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker><marker id="s-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker></defs>
<rect width="1600" height="980" fill="#ffffff"/>
<text x="40" y="58" font-size="32" font-weight="700" fill="#0f172a">어느 OS 에서나 도는 에이전트 - 바이너리 하나, 컨테이너 없음</text>
<text x="40" y="92" font-size="18" fill="#475569">CGO 를 끈 정적 바이너리 하나로 만든다 (OCB 기본값). GPU · NPU 도 exporter 컨테이너 없이 같은 바이너리 안에서 읽는다</text>
<rect x="40" y="120" width="740" height="560" rx="22" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="64" y="156" font-size="19" fill="#991b1b" font-weight="700" text-anchor="start">exporter 컨테이너 방식 (예: dcgm-exporter)</text>
<rect x="80" y="180" width="660" height="68" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="410.0" y="219.6" font-size="16" fill="#991b1b" font-weight="700" text-anchor="middle">dcgm-exporter 컨테이너</text>
<rect x="80" y="265" width="660" height="68" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="410.0" y="304.6" font-size="16" fill="#92400e" font-weight="700" text-anchor="middle">컨테이너 런타임 (docker · podman, OS 마다 다름)</text>
<rect x="80" y="350" width="660" height="68" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="410.0" y="389.6" font-size="16" fill="#92400e" font-weight="700" text-anchor="middle">nvidia-container-toolkit · 런타임 훅</text>
<rect x="80" y="435" width="660" height="68" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="410.0" y="474.6" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle">GPU 드라이버</text>
<text x="80" y="560" font-size="14.5" fill="#b91c1c" font-weight="400" text-anchor="start">- toolkit 이 컨테이너 런타임 설정을 바꾼다</text>
<text x="80" y="592" font-size="14.5" fill="#b91c1c" font-weight="400" text-anchor="start">- SELinux: /dev/nvidia* 를 컨테이너가 열려면</text>
<text x="80" y="624" font-size="14.5" fill="#b91c1c" font-weight="400" text-anchor="start">  label=disable 또는 nvidia-container-selinux 필요</text>
<rect x="820" y="120" width="740" height="560" rx="22" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="844" y="156" font-size="19" fill="#065f46" font-weight="700" text-anchor="start">이 설계의 에이전트</text>
<rect x="860" y="180" width="660" height="68" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="1190.0" y="219.6" font-size="16" fill="#9a3412" font-weight="700" text-anchor="middle">cmp-otelcol (OCB, 정적 Go 바이너리, CGO 0)</text>
<rect x="860" y="265" width="660" height="68" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1190.0" y="304.6" font-size="16" fill="#5b21b6" font-weight="700" text-anchor="middle">벤더 CLI exec · purego dlopen · 순수 Go</text>
<rect x="860" y="350" width="660" height="68" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="1190.0" y="389.6" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle">GPU · NPU 드라이버 (원래 깔려 있는 것)</text>
<text x="860" y="470" font-size="14.5" fill="#065f46" font-weight="400" text-anchor="start">+ glibc · 배포판 버전에 묶이지 않는다</text>
<text x="860" y="504" font-size="14.5" fill="#065f46" font-weight="400" text-anchor="start">+ 컨테이너 런타임이 없어도 된다 (podman 불필요)</text>
<text x="860" y="538" font-size="14.5" fill="#065f46" font-weight="400" text-anchor="start">+ systemd 서비스 하나 · Windows 서비스 하나</text>
<text x="860" y="572" font-size="14.5" fill="#065f46" font-weight="400" text-anchor="start">+ 드라이버 없는 서버에서는 해당 부품이 조용히 꺼진다</text>
<text x="860" y="606" font-size="14.5" fill="#065f46" font-weight="400" text-anchor="start">- OBI(eBPF) 만 커널 조건이 있다 (5.8+ · RHEL 8 4.18 · BTF)</text>
<rect x="40" y="710" width="1520" height="240" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
<text x="64" y="748" font-size="19" fill="#0f172a" font-weight="700" text-anchor="start">SELinux (RHEL · Rocky 등 enforcing)</text>
<text x="64" y="788" font-size="14.5" fill="#334155" font-weight="400" text-anchor="start">· 바이너리를 bin_t 로 라벨링하면 systemd 가 unconfined_service_t 로 띄운다 → 로그 읽기 · 벤더 CLI 실행이 정책에 막히지 않는다 (PoC 에서 AVC 가 0건인지 본다)</text>
<text x="64" y="820" font-size="14.5" fill="#334155" font-weight="400" text-anchor="start">· chcon 으로 붙인 라벨은 전체 재라벨링(restorecon · autorelabel) 때 풀린다</text>
<text x="64" y="852" font-size="14.5" fill="#334155" font-weight="400" text-anchor="start">  → semanage fcontext 로 규칙을 등록하고 restorecon 한다. semanage 가 없는 OS 만 chcon 으로 둔다</text>
<text x="64" y="884" font-size="14.5" fill="#334155" font-weight="400" text-anchor="start">· 컨테이너를 안 쓰므로 container_t · 장치 라벨 · :z 마운트 문제가 생기지 않는다</text>
<text x="64" y="916" font-size="14.5" fill="#334155" font-weight="400" text-anchor="start">· OBI 는 별도 프로세스로 root 또는 CAP_BPF · PERFMON 등을 준다. 에이전트 본체는 높은 권한이 필요 없다. BPF 로드가 막히는지는 PoC 에서 본다</text>
</svg>