<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">
<defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="s-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker><marker id="s-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ea580c"/></marker><marker id="s-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ea580c"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#059669"/></marker><marker id="s-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#059669"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c3aed"/></marker><marker id="s-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c3aed"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker><marker id="s-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker></defs>
<rect width="1600" height="1000" fill="#ffffff"/>
<text x="40" y="58" font-size="32" font-weight="700" fill="#0f172a">에이전트 - OCB 로 빌드한 커스텀 OTel Collector</text>
<text x="40" y="92" font-size="18" fill="#475569">공식 부품으로 되는 것은 공식 부품으로, 공식 부품에 없는 기능은 자체 부품으로 만든다. 보라색이 자체 부품</text>
<rect x="40" y="120" width="1180" height="850" rx="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="64" y="156" font-size="19" fill="#0f172a" font-weight="700" text-anchor="start">서버 (Linux / Windows) - cmp-otelcol 바이너리 하나, 컨테이너 없음</text>
<text x="200" y="185" font-size="17" fill="#334155" font-weight="700" text-anchor="middle">받기 (receiver)</text>
<text x="560" y="185" font-size="17" fill="#334155" font-weight="700" text-anchor="middle">다듬기 (processor)</text>
<text x="950" y="185" font-size="17" fill="#334155" font-weight="700" text-anchor="middle">보내기 (exporter)</text>
<rect x="65" y="205" width="270" height="80" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="200.0" y="241.3625" font-size="15.5" fill="#0f172a" font-weight="700" text-anchor="middle">hostmetrics</text>
<text x="200.0" y="261.4875" font-size="12.5" fill="#475569" font-weight="400" text-anchor="middle">CPU · 메모리 · 디스크 · 네트워크 · 프로세스</text>
<path d="M335,245 C370,245 390,560 438,560" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#m-gray)"/>
<rect x="65" y="299" width="270" height="80" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="200.0" y="335.3625" font-size="15.5" fill="#5b21b6" font-weight="700" text-anchor="middle">unifiedlog (자체)</text>
<text x="200.0" y="355.4875" font-size="12.5" fill="#6d28d9" font-weight="400" text-anchor="middle">rsyslog · journald · eventlog 자동 선택</text>
<path d="M335,339 C370,339 390,560 438,560" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#m-gray)"/>
<rect x="65" y="393" width="270" height="80" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="200.0" y="429.3625" font-size="15.5" fill="#5b21b6" font-weight="700" text-anchor="middle">servicelog (자체)</text>
<text x="200.0" y="449.4875" font-size="12.5" fill="#6d28d9" font-weight="400" text-anchor="middle">데몬 · 컨테이너 로그 파일 자동 발견</text>
<path d="M335,433 C370,433 390,560 438,560" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#m-gray)"/>
<rect x="65" y="487" width="270" height="80" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="200.0" y="523.3625" font-size="15.5" fill="#5b21b6" font-weight="700" text-anchor="middle">accelerator (자체)</text>
<text x="200.0" y="543.4875" font-size="12.5" fill="#6d28d9" font-weight="400" text-anchor="middle">NVIDIA smi·GPM · AMD · Rebellions · Furiosa</text>
<path d="M335,527 C370,527 390,560 438,560" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#m-gray)"/>
<rect x="65" y="581" width="270" height="80" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="200.0" y="617.3625" font-size="15.5" fill="#5b21b6" font-weight="700" text-anchor="middle">winpackettrace (자체)</text>
<text x="200.0" y="637.4875" font-size="12.5" fill="#6d28d9" font-weight="400" text-anchor="middle">Windows HTTP · DB span</text>
<path d="M335,621 C370,621 390,560 438,560" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#m-gray)"/>
<rect x="65" y="675" width="270" height="80" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="200.0" y="711.3625" font-size="15.5" fill="#0f172a" font-weight="700" text-anchor="middle">otlp</text>
<text x="200.0" y="731.4875" font-size="12.5" fill="#475569" font-weight="400" text-anchor="middle">OBI(eBPF, 별도 프로세스) · 앱</text>
<path d="M335,715 C370,715 390,560 438,560" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#m-gray)"/>
<rect x="65" y="769" width="270" height="80" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="200.0" y="805.3625" font-size="15.5" fill="#5b21b6" font-weight="700" text-anchor="middle">vsphere (자체, 중앙 수집기)</text>
<text x="200.0" y="825.4875" font-size="12.5" fill="#6d28d9" font-weight="400" text-anchor="middle">vCenter 성능 · 이벤트 · ESXi syslog</text>
<path d="M335,809 C370,809 390,560 438,560" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#m-gray)"/>
<rect x="65" y="863" width="270" height="80" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="200.0" y="899.3625" font-size="15.5" fill="#0f172a" font-weight="700" text-anchor="middle">prometheus (선택)</text>
<text x="200.0" y="919.4875" font-size="12.5" fill="#475569" font-weight="400" text-anchor="middle">있는 exporter · vLLM 긁기</text>
<path d="M335,903 C370,903 390,560 438,560" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#m-gray)"/>
<rect x="440" y="300" width="240" height="290" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="560.0" y="373.34999999999997" font-size="19" fill="#9a3412" font-weight="700" text-anchor="middle">공통 처리</text>
<text x="560.0" y="394.92499999999995" font-size="13.5" fill="#9a3412" font-weight="400" text-anchor="middle">memory_limiter</text>
<text x="560.0" y="414.49999999999994" font-size="13.5" fill="#9a3412" font-weight="400" text-anchor="middle">resourcedetection</text>
<text x="560.0" y="434.075" font-size="13.5" fill="#9a3412" font-weight="400" text-anchor="middle">uuid · credential_id 등</text>
<text x="560.0" y="453.65" font-size="13.5" fill="#9a3412" font-weight="400" text-anchor="middle">공통 태그</text>
<text x="560.0" y="473.22499999999997" font-size="13.5" fill="#9a3412" font-weight="400" text-anchor="middle"></text>
<text x="560.0" y="492.79999999999995" font-size="13.5" fill="#9a3412" font-weight="400" text-anchor="middle">transform (OTTL)</text>
<text x="560.0" y="512.375" font-size="13.5" fill="#9a3412" font-weight="400" text-anchor="middle">deltatocumulative</text>
<text x="560.0" y="531.9499999999999" font-size="13.5" fill="#9a3412" font-weight="400" text-anchor="middle">batch</text>
<rect x="440" y="620" width="240" height="160" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="560.0" y="676.2375000000001" font-size="16" fill="#5b21b6" font-weight="700" text-anchor="middle">자체 processor</text>
<text x="560.0" y="697.8125000000001" font-size="13.5" fill="#6d28d9" font-weight="400" text-anchor="middle">프로세스 Top10</text>
<text x="560.0" y="717.3875" font-size="13.5" fill="#6d28d9" font-weight="400" text-anchor="middle">XID 로그 ↔ GPU 지표</text>
<text x="560.0" y="736.9625000000001" font-size="13.5" fill="#6d28d9" font-weight="400" text-anchor="middle">GPU 이름 맞추기</text>
<path d="M560,590 L560,618" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#m-gray)"/>
<rect x="770" y="300" width="360" height="200" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="950.0" y="357.3625" font-size="18" fill="#5b21b6" font-weight="700" text-anchor="middle">cmpotlp (자체 exporter)</text>
<text x="950.0" y="378.9375" font-size="13.5" fill="#6d28d9" font-weight="400" text-anchor="middle">otlphttp 에 노드 주소 목록을 붙인 것</text>
<text x="950.0" y="398.5125" font-size="13.5" fill="#6d28d9" font-weight="400" text-anchor="middle"></text>
<text x="950.0" y="418.08750000000003" font-size="13.5" fill="#6d28d9" font-weight="400" text-anchor="middle">주소 순서: A,B 또는 B,A</text>
<text x="950.0" y="437.6625" font-size="13.5" fill="#6d28d9" font-weight="400" text-anchor="middle">(관리 서버 가 서버마다 정함)</text>
<text x="950.0" y="457.2375" font-size="13.5" fill="#6d28d9" font-weight="400" text-anchor="middle">보내기 실패 → 다음 주소</text>
<path d="M680,450 L768,410" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#m-blue)"/>
<rect x="770" y="540" width="360" height="120" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="950.0" y="586.375" font-size="17" fill="#92400e" font-weight="700" text-anchor="middle">디스크 큐 (file_storage)</text>
<text x="950.0" y="607.95" font-size="13.5" fill="#b45309" font-weight="400" text-anchor="middle">주소를 고르기 전에 쌓는다</text>
<text x="950.0" y="627.525" font-size="13.5" fill="#b45309" font-weight="400" text-anchor="middle">재시작해도 남는다</text>
<path d="M950,538 L950,502" stroke="#d97706" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#m-amber)"/>
<rect x="770" y="700" width="360" height="160" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="950.0" y="756.5875000000001" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">원격 관리 (OpAMP)</text>
<text x="950.0" y="778.1625000000001" font-size="13.5" fill="#475569" font-weight="400" text-anchor="middle">관리 서버 가 설정을 내려보내고</text>
<text x="950.0" y="797.7375000000001" font-size="13.5" fill="#475569" font-weight="400" text-anchor="middle">상태를 받는다</text>
<text x="950.0" y="817.3125000000001" font-size="13.5" fill="#475569" font-weight="400" text-anchor="middle">(후속, 처음엔 배포 도구로)</text>
