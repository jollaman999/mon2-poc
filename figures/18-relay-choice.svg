<text x="64" y="790" font-size="19" fill="#92400e" font-weight="700" text-anchor="start">그래서</text>
<text x="64" y="828" font-size="15.5" fill="#92400e" font-weight="400" text-anchor="start">· 에이전트는 OTel (OCB), 중계는 Victoria. 에이전트는 서버마다 수집 · 가공을, 중계는 복제 · 버퍼를 맡는다</text>
<text x="64" y="862" font-size="15.5" fill="#92400e" font-weight="400" text-anchor="start">· 기존 Prometheus · Influx · Loki 형식 수집기가 들어오는 입구가 vmagent · vlagent 에선 기본 기능이다</text>
<text x="64" y="896" font-size="15.5" fill="#92400e" font-weight="400" text-anchor="start">· 트레이스만은 다시 볼 조건이 있다: vtagent 가 불안하거나 tail sampling 이 필요해지면 트레이스만 OTel 게이트웨이로 바꾼다</text>
<text x="64" y="930" font-size="15.5" fill="#92400e" font-weight="400" text-anchor="start">  (에이전트는 :4318 그대로라 중앙만 바꾸면 된다)</text>
