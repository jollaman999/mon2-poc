<text x="64" y="690" font-size="16" fill="#065f46" font-weight="400" text-anchor="start">① 노드 A 전원 차단 → 에이전트 전환 시간, 데이터 빈틈</text>
<text x="824" y="690" font-size="16" fill="#065f46" font-weight="400" text-anchor="start">② 노드 B 1시간 정지 → 복구 뒤 큐가 비고 양쪽 건수가 같은가</text>
<text x="64" y="742" font-size="16" fill="#065f46" font-weight="400" text-anchor="start">③ 노드 사이 네트워크 단절 → 각자 받고 복구 후 같아지는가</text>
<text x="824" y="742" font-size="16" fill="#065f46" font-weight="400" text-anchor="start">④ 중계 프로세스만 죽이기 → HAProxy 가 상대 노드로 보내는가</text>
<text x="64" y="794" font-size="16" fill="#065f46" font-weight="400" text-anchor="start">⑤ 큐 한도 초과 → 빈 구간 보충 절차가 되는가</text>
<text x="824" y="794" font-size="16" fill="#065f46" font-weight="400" text-anchor="start">⑥ vmalert 한쪽 정지 → 알림이 한 번만 오는가</text>
