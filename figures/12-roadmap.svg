<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">
<defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="s-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker><marker id="s-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ea580c"/></marker><marker id="s-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ea580c"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#059669"/></marker><marker id="s-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#059669"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c3aed"/></marker><marker id="s-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c3aed"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker><marker id="s-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="40" y="58" font-size="32" font-weight="700" fill="#0f172a">도입 순서 - 작게 띄우고 넓힌다</text>
<text x="40" y="92" font-size="18" fill="#475569">단계마다 되돌릴 수 있게 하고, 앞 단계의 시험을 통과한 뒤에 넘어간다</text>
<path d="M60,330 L1550,330" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#m-gray)"/>
<circle cx="165" cy="330" r="26" fill="#1e3a8a"/>
<text x="165" y="339" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">0</text>
<rect x="50" y="150" width="230" height="140" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="165.0" y="227.35" font-size="21" fill="#9a3412" font-weight="700" text-anchor="middle">PoC</text>
<rect x="50" y="380" width="230" height="200" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
<text x="165" y="425" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">중앙 2노드</text>
<text x="165" y="459" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">에이전트 시험 VM</text>
<text x="165" y="493" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">장애 시험 · 큐 실측</text>
<circle cx="417" cy="330" r="26" fill="#1e3a8a"/>
<text x="417" y="339" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<rect x="302" y="150" width="230" height="140" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="417.0" y="227.35" font-size="21" fill="#065f46" font-weight="700" text-anchor="middle">중앙 구축</text>
<rect x="302" y="380" width="230" height="200" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
<text x="417" y="425" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">HAProxy × 2</text>
<text x="417" y="459" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">Victoria 3종 × 2</text>
<text x="417" y="493" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">vmalert · AM × 2</text>
<circle cx="669" cy="330" r="26" fill="#1e3a8a"/>
<text x="669" y="339" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<rect x="554" y="150" width="230" height="140" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="669.0" y="227.35" font-size="21" fill="#5b21b6" font-weight="700" text-anchor="middle">에이전트 배포</text>
<rect x="554" y="380" width="230" height="200" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
<text x="669" y="425" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">서버 그룹별로</text>
<text x="669" y="459" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">Linux · Windows</text>
<text x="669" y="493" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">GPU · NPU 서버</text>
<circle cx="921" cy="330" r="26" fill="#1e3a8a"/>
<text x="921" y="339" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<rect x="806" y="150" width="230" height="140" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="921.0" y="227.35" font-size="21" fill="#92400e" font-weight="700" text-anchor="middle">관리 서버 연결</text>
<rect x="806" y="380" width="230" height="200" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
<text x="921" y="425" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">조회 (Prometheus API)</text>
<text x="921" y="459" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">알림 규칙 HTTP 제공</text>
<text x="921" y="493" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">webhook 수신</text>
<circle cx="1173" cy="330" r="26" fill="#1e3a8a"/>
<text x="1173" y="339" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<rect x="1058" y="150" width="230" height="140" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1173.0" y="227.35" font-size="21" fill="#065f46" font-weight="700" text-anchor="middle">vSphere · 확장</text>
<rect x="1058" y="380" width="230" height="200" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
<text x="1173" y="425" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">중앙 수집기</text>
<text x="1173" y="459" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">기존 Prometheus 합류</text>
<text x="1173" y="493" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">용량 재산정</text>
<circle cx="1425" cy="330" r="26" fill="#1e3a8a"/>
<text x="1425" y="339" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<rect x="1310" y="150" width="230" height="140" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="1425.0" y="227.35" font-size="21" fill="#0f172a" font-weight="700" text-anchor="middle">운영</text>
<rect x="1310" y="380" width="230" height="200" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
<text x="1425" y="425" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">큐 · 디스크 경보</text>
<text x="1425" y="459" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">백업 (vmbackup)</text>
<text x="1425" y="493" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">정기 장애 훈련</text>
<rect x="50" y="620" width="1500" height="230" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="74" y="660" font-size="21" fill="#92400e" font-weight="700" text-anchor="start">단계마다 지키는 것</text>
<text x="74" y="700" font-size="15.5" fill="#92400e" font-weight="400" text-anchor="start">· 에이전트는 서버 그룹별로 배포한다. 문제가 나면 그 그룹만 되돌린다</text>
<text x="74" y="734" font-size="15.5" fill="#92400e" font-weight="400" text-anchor="start">· 관리 서버는 두 저장소가 함께 지원하는 Prometheus API 와 PromQL 만 쓴다 (나중에 저장소를 바꿀 수 있게)</text>
<text x="74" y="768" font-size="15.5" fill="#92400e" font-weight="400" text-anchor="start">· 큐 한도와 디스크 크기는 PoC 에서 잰 하루 유입량으로 정한다</text>
<text x="74" y="802" font-size="15.5" fill="#92400e" font-weight="400" text-anchor="start">· vtagent 가 불안하면 트레이스만 OTel 게이트웨이로 바꾼다. 에이전트는 그대로다</text>
</svg>