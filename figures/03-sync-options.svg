<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif">
<defs><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="s-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker><marker id="s-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ea580c"/></marker><marker id="s-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ea580c"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#059669"/></marker><marker id="s-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#059669"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#dc2626"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c3aed"/></marker><marker id="s-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c3aed"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker><marker id="s-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="40" y="58" font-size="32" font-weight="700" fill="#0f172a">양쪽 저장소를 같게 유지하는 4가지 방법</text>
<text x="40" y="92" font-size="18" fill="#475569">노드가 2대일 때 각각 무엇을 얻고 무엇을 잃는가</text>
<rect x="40" y="130" width="365" height="720" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
<text x="222" y="172" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">① 중계 에이전트가 양쪽에 기록</text>
<rect x="177" y="188" width="90" height="34" rx="17" fill="#059669"/>
<text x="222" y="212" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">선택</text>
<rect x="425" y="130" width="365" height="720" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="607" y="172" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">② 저장소 클러스터 복제</text>
<rect x="562" y="188" width="90" height="34" rx="17" fill="#d97706"/>
<text x="607" y="212" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">보류</text>
<rect x="810" y="130" width="365" height="720" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="992" y="172" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">③ 공유 오브젝트 스토리지</text>
<rect x="947" y="188" width="90" height="34" rx="17" fill="#dc2626"/>
<text x="992" y="212" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">탈락</text>
<rect x="1195" y="130" width="365" height="720" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="1377" y="172" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">④ 저장소끼리 사후 동기화</text>
<rect x="1332" y="188" width="90" height="34" rx="17" fill="#dc2626"/>
<text x="1377" y="212" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">탈락</text>
<rect x="152" y="245" width="140" height="60" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="222.0" y="280.95" font-size="17" fill="#9a3412" font-weight="700" text-anchor="middle">중계 agent</text>
<rect x="70" y="360" width="130" height="70" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="135.0" y="390.8" font-size="17" fill="#065f46" font-weight="700" text-anchor="middle">저장소 A</text>
<text x="135.0" y="413.1" font-size="14" fill="#047857" font-weight="400" text-anchor="middle">전체 사본</text>
<rect x="245" y="360" width="130" height="70" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="310.0" y="390.8" font-size="17" fill="#065f46" font-weight="700" text-anchor="middle">저장소 B</text>
<text x="310.0" y="413.1" font-size="14" fill="#047857" font-weight="400" text-anchor="middle">전체 사본</text>
<path d="M200,305 L140,358" stroke="#ea580c" stroke-width="3" fill="none" marker-end="url(#m-orange)"/>
<path d="M245,305 L305,358" stroke="#ea580c" stroke-width="3" fill="none" marker-end="url(#m-orange)"/>
<text x="222" y="470" font-size="15" fill="#9a3412" font-weight="700" text-anchor="middle">목적지마다 디스크 큐</text>
<rect x="537" y="245" width="140" height="60" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="607.0" y="280.95" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">insert</text>
<rect x="455" y="360" width="130" height="70" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="520.0" y="390.8" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">storage A</text>
<text x="520.0" y="413.1" font-size="14" fill="#475569" font-weight="400" text-anchor="middle">복제 2벌</text>
<rect x="630" y="360" width="130" height="70" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="695.0" y="390.8" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">storage B</text>
<text x="695.0" y="413.1" font-size="14" fill="#475569" font-weight="400" text-anchor="middle">복제 2벌</text>
<path d="M585,305 L525,358" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#m-gray)"/>
<path d="M630,305 L690,358" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#m-gray)"/>
<text x="607" y="470" font-size="15" fill="#475569" font-weight="700" text-anchor="middle">insert · select · storage 3종</text>
<rect x="840" y="245" width="130" height="60" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="905.0" y="280.95" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">Loki A</text>
<rect x="1015" y="245" width="130" height="60" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="1080.0" y="280.95" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">Loki B</text>
<rect x="880" y="360" width="225" height="70" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="992.5" y="390.8" font-size="17" fill="#92400e" font-weight="700" text-anchor="middle">MinIO / Ceph</text>
<text x="992.5" y="413.1" font-size="14" fill="#b45309" font-weight="400" text-anchor="middle">노드 3대 이상 필요</text>
<path d="M905,305 L960,358" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#m-gray)"/>
<path d="M1080,305 L1025,358" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#m-gray)"/>
<text x="992" y="470" font-size="15" fill="#b45309" font-weight="700" text-anchor="middle">Loki·Tempo·Thanos 의 흔한 구성</text>
<rect x="1225" y="300" width="130" height="70" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="1290.0" y="340.95" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">저장소 A</text>
<rect x="1400" y="300" width="130" height="70" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="1465.0" y="340.95" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">저장소 B</text>
<path d="M1355,335 L1398,335" stroke="#475569" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#m-gray)" marker-start="url(#s-gray)"/>
<text x="1377" y="290" font-size="14" fill="#475569" font-weight="400" text-anchor="middle">export → import</text>
<text x="1377" y="470" font-size="15" fill="#475569" font-weight="700" text-anchor="middle">주기적 복사 작업</text>
<text x="70" y="530" font-size="16" fill="#047857" font-weight="400" text-anchor="start">+ 노드 1대가 죽어도 쓰기가 안 멈춤</text>
<text x="70" y="568" font-size="16" fill="#047857" font-weight="400" text-anchor="start">+ 정족수 불필요 = 2노드로 충분</text>
<text x="70" y="606" font-size="16" fill="#047857" font-weight="400" text-anchor="start">+ 각 노드가 완전한 사본</text>
<text x="70" y="644" font-size="16" fill="#047857" font-weight="400" text-anchor="start">+ Victoria 3종 모두 같은 방식</text>
<text x="70" y="682" font-size="16" fill="#b91c1c" font-weight="400" text-anchor="start">- 디스크 2배</text>
<text x="70" y="720" font-size="16" fill="#b91c1c" font-weight="400" text-anchor="start">- 큐 한도를 넘는 장애는</text>
<text x="70" y="758" font-size="16" fill="#b91c1c" font-weight="400" text-anchor="start">   빈 구간을 수동 보충</text>
<text x="455" y="530" font-size="16" fill="#047857" font-weight="400" text-anchor="start">+ 조회 시 두 사본을 합쳐 빈틈 없음</text>
<text x="455" y="568" font-size="16" fill="#047857" font-weight="400" text-anchor="start">+ 노드 추가로 확장</text>
<text x="455" y="606" font-size="16" fill="#b91c1c" font-weight="400" text-anchor="start">- 로그·트레이스는 저장소 복제</text>
<text x="455" y="644" font-size="16" fill="#b91c1c" font-weight="400" text-anchor="start">   기능이 없음 (메트릭만 가능)</text>
<text x="455" y="682" font-size="16" fill="#b91c1c" font-weight="400" text-anchor="start">- 컴포넌트 3배</text>
<text x="455" y="720" font-size="16" fill="#92400e" font-weight="700" text-anchor="start">→ 메트릭이 커지면 다시 검토</text>
<text x="840" y="530" font-size="16" fill="#047857" font-weight="400" text-anchor="start">+ 장기 보관이 싸다</text>
<text x="840" y="568" font-size="16" fill="#b91c1c" font-weight="400" text-anchor="start">- MinIO 2노드는 1대 장애 시</text>
<text x="840" y="606" font-size="16" fill="#b91c1c" font-weight="400" text-anchor="start">   쓰기 정족수 부족</text>
<text x="840" y="644" font-size="16" fill="#b91c1c" font-weight="400" text-anchor="start">- MinIO 커뮤니티판은 유지보수만</text>
<text x="840" y="682" font-size="16" fill="#b91c1c" font-weight="400" text-anchor="start">- 3노드 이상 + Ceph 필요</text>
<text x="1225" y="530" font-size="16" fill="#047857" font-weight="400" text-anchor="start">+ 저장소를 안 건드림</text>
<text x="1225" y="568" font-size="16" fill="#b91c1c" font-weight="400" text-anchor="start">- 동기화 주기만큼 늘 어긋남</text>
<text x="1225" y="606" font-size="16" fill="#b91c1c" font-weight="400" text-anchor="start">- 로그·트레이스용 도구 없음</text>
<text x="1225" y="644" font-size="16" fill="#b91c1c" font-weight="400" text-anchor="start">- 충돌 처리를 직접 만들어야</text>
</svg>